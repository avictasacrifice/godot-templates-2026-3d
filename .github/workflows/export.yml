name: Export Godot Game

on:
  push:
    branches: [ main ] 
  workflow_dispatch: 

env:
  GODOT_VERSION: "4.7.2"        
  EXPORT_NAME: "MyGame"        

jobs:
  export:
    name: Export — ${{ matrix.preset }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: "Windows Desktop"
            artifact: windows
            output_path: build/windows/${{ env.EXPORT_NAME }}.exe
          - preset: "Web"
            artifact: web
            output_path: build/web/index.html

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Set up Godot ${{ env.GODOT_VERSION }}
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false       # true если проект на C#
          include-templates: true # устанавливает экспортные шаблоны

      - name: Create output directory
        run: mkdir -p $(dirname ${{ matrix.output_path }})

      - name: Export — ${{ matrix.preset }}
        run: |
          godot --headless --export-release "${{ matrix.preset }}" "${{ matrix.output_path }}"

      - name: Upload artifact — ${{ matrix.artifact }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.EXPORT_NAME }}-${{ matrix.artifact }}
          path: build/${{ matrix.artifact }}/
          if-no-files-found: error